# D3D8 state-setting and texture-stage names proven in Fuzion Frenzy default.xbe (XDK 3925).
# Evidence: docs/d3d8-state-symbols.md. 41 of the 52 adopted names; the other 11 are absent from this image.
# Before merging, read "Wiring preconditions" in that doc: XDK 3925 numbers its render states and deferred
# texture-stage states differently from the 5849 tables the SDK uses today.
# Held back from the default merge: see the note above.
staged = true

[symbols]
# device.obj
D3DDevice_SetTransform                         = 0x1F5360
D3DDevice_SetMaterial                          = 0x1F54A0
D3DDevice_SetViewport                          = 0x1F5B70
D3DDevice_SetLight                             = 0x1F5CD0
D3DDevice_LightEnable                          = 0x1F5EB0
D3DDevice_SetTexture                           = 0x1F5F90
D3DDevice_SetIndices                           = 0x1F6170
D3DDevice_SetScissors                          = 0x1F6300
# state.obj, numbering-independent leaves (method/value or texture states 22..30)
D3DDevice_SetRenderState_Simple                = 0x1F6650
D3DDevice_SetTextureState_TexCoordIndex        = 0x1F6BF0
