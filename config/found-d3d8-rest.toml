[symbols]
# PROVEN BUT HELD BACK - do not merge until all three prerequisites exist.
# 0x1F84A0 is D3DDevice_SetVertexShaderConstant beyond doubt (stdcall (Register, pData, Count),
# retn 0Ch, NV2A token 0x41EA4, (count << 18) | 0xB80 chunks, 29 title call sites; docs section
# "Proven but held back"). It is a 3925-only form: the name has no [symbols] row in config/game.toml,
# no row in any sdk/xdk/*/signatures.toml (only the fastcall Constant1/1Fast/4/NotInlineFast rows
# exist, and those bodies are absent here), and sdk/runtime/xdk/d3d8.cpp has no host body for the
# plain name (only the four fastcall variants, which this build does not have). Merging it now would
# be refused by tools/merge_symbols.py ("not a name the scanner knows"), and naming it without a
# host body would only replace a working guest body with nothing. The orchestrator needs to add the
# 3925 signature row first (the hand-added no-signature form, as for D3DDevice_Present), let the
# scanner put a row in game.toml, and add an HLE_STDCALL(D3DDevice_SetVertexShaderConstant, 3) that
# stores the constants like the fastcall bodies do (register + 96 is this build's numbering: the
# guest body adds 60h to the register before use, and its mirror copy lands at
# device + (Register + 300) * 16; the host's own constant copy is indexed by the guest register in
# every other SetVertexShaderConstant path, so the +96 has to be accounted for there, not ignored).
# D3DDevice_SetVertexShaderConstant = 0x1F84A0

# UNPROVABLE - do not merge on this evidence.
