name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu
            valgrind: "1"
            launcher: "0"
            paths: "1"
          - os: macos-14
            name: macos-arm64
            valgrind: "0"
            launcher: "1"
            paths: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Reject game-derived paths
        if: matrix.paths == '1'
        run: |
          sh tools/hooks/forbid-game-paths.sh --self-test
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            git fetch origin "${{ github.event.repository.default_branch }}"
            range="origin/${{ github.event.repository.default_branch }}...HEAD"
          fi
          git diff --name-only --diff-filter=ACMRDT "$range" | sh tools/hooks/forbid-game-paths.sh

      - name: Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build python3 valgrind \
            libvulkan-dev glslang-dev zlib1g-dev pkg-config

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install cmake ninja glslang molten-vk vulkan-loader vulkan-headers libusb

      - name: Math digest
        run: |
          if [ "${{ matrix.valgrind }}" = "1" ]; then
            FP_VALGRIND=1 sh scripts/fp-digest-host.sh
          else
            sh scripts/fp-digest-host.sh
          fi

      - name: det-diff
        run: python3 scripts/det-diff.py --self-check

      - name: SDK host tools
        run: |
          cmake -S . -B "$RUNNER_TEMP/sdk-tools" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXBE_HOST_TOOLS_ONLY=ON
          cmake --build "$RUNNER_TEMP/sdk-tools" --parallel

      - name: SDK runtime
        run: |
          cmake -S . -B "$RUNNER_TEMP/sdk-runtime" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXBE_CI_RUNTIME=ON
          cmake --build "$RUNNER_TEMP/sdk-runtime" --target xbe_runtime --parallel

      - name: Launcher
        if: matrix.launcher == '1'
        run: |
          sdk=$(xcrun --show-sdk-path)
          swiftc -parse-as-library -O -swift-version 5 \
            -target arm64-apple-macosx14.0 \
            -sdk "$sdk" \
            -framework SwiftUI -framework AppKit -framework CryptoKit \
            -o "$RUNNER_TEMP/RingHostLauncher" \
            macos/launcher/Sources/*.swift
